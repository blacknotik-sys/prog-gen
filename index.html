<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>">
  <style>
    :root {

      --accent-gold: #ffa502;
      --accent-cyan: #1e90ff;
      --text: #e1e1e6;
      --text-dim: #a0a0b0;
      --border: #282836;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 980px; width: 100%; }
    h1 { text-align: center; color: var(--accent); margin-bottom: 4px; }
    .subtitle { text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 25px; }
    .controls-top { background: var(--card-bg); padding: 18px 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 15px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; }
    .ctrl-group { display: flex; align-items: center; gap: 8px; }
    .toggle-container { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: var(--accent-gold); cursor: pointer; }
    .tuning-badge { background: var(--accent); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    select, button, input[type="number"], textarea { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: #232330; color: var(--text); font-size: 14px; transition: all 0.2s; }
    input[type="number"] { width: 75px; font-weight: bold; color: var(--accent-cyan); }
    textarea { width: 100%; height: 60px; box-sizing: border-box; resize: vertical; font-family: inherit; margin-top: 6px; }
    select:focus, button:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button { cursor: pointer; }
    button:hover { background: var(--accent); color: #fff; }
    .btn-main { background: var(--accent); color: #fff; font-weight: bold; }
    .btn-midi-all { background: var(--accent-green); color: #fff; font-weight: bold; }
    .btn-midi-section { background: #252836; color: var(--accent-green); border: 1px solid var(--accent-green); font-weight: bold; padding: 6px 10px; font-size: 12px; }
    .btn-midi-section:hover { background: var(--accent-green); color: #fff; }
    .btn-vocal { background: #1c2b36; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); font-weight: bold; padding: 6px 10px; font-size: 12px; }
    .btn-vocal:hover { background: var(--accent-cyan); color: #fff; }
    .btn-evolve { background: #3a1c42; color: #e056fd; border: 1px solid #be2edd; font-weight: bold; padding: 6px 10px; font-size: 12px; }
    .btn-evolve:hover { background: #be2edd; color: #fff; }
    .song-section { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 18px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; transition: all 0.3s; }
    .song-section.disliked { opacity: 0.45; filter: grayscale(0.6); border-color: #4a2020; }
    .song-section.liked { border-color: var(--accent-green); box-shadow: 0 0 10px rgba(46, 213, 115, 0.15); }
    .section-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .section-title { font-size: 18px; font-weight: bold; color: var(--accent); }
    .feedback-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: #1c1c28; cursor: pointer; }
    .feedback-btn.active-like { background: #1b472c; border-color: var(--accent-green); color: var(--accent-green); }
    .feedback-btn.active-dislike { background: #4a1c1c; border-color: var(--accent); color: var(--accent); }
    .progression-display { background: #121218; padding: 14px; border-radius: 8px; border: 1px solid #222230; }
    .chords { font-size: 22px; font-weight: bold; letter-spacing: 1px; color: #fff; margin-bottom: 6px; }
    .mood-box { font-size: 13px; color: var(--accent-gold); font-style: italic; margin-bottom: 8px; }
    .numerals { font-size: 13px; color: var(--text-dim); }
    .lyrics-box { background: #151620; border: 1px solid #2b2d40; border-radius: 8px; padding: 10px 14px; }
    .lyrics-title { font-size: 13px; font-weight: bold; color: var(--accent-purple); display: flex; justify-content: space-between; align-items: center; }
    .vocal-preview { font-family: monospace; font-size: 12px; color: var(--accent-cyan); margin-top: 8px; background: #0c1018; padding: 8px; border-radius: 6px; word-break: break-all; }
    .rhythm-box { background: #12131a; border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 0 8px 8px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .rhythm-info { font-size: 13px; }
    .rhythm-pattern { font-family: monospace; font-size: 15px; font-weight: bold; color: var(--accent); letter-spacing: 1px; }
    .tabs-box { background: #121218; border: 1px solid #222230; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; }
    .tabs-title { color: var(--accent-gold); font-weight: bold; margin-bottom: 8px; font-family: 'Segoe UI', sans-serif; }
    .tabs-grid { display: flex; gap: 12px; flex-wrap: wrap; }
    .tab-item { background: #1e1e2a; padding: 8px 12px; border-radius: 6px; border: 1px solid #2d2d3e; }
    .tab-chord-name { color: #fff; font-weight: bold; font-size: 14px; }
    .tab-frets { color: var(--accent-green); font-weight: bold; margin-top: 2px; }
    .tab-shape { color: var(--text-dim); font-size: 11px; }
    .sounddesign-box { background: #121622; border: 1px solid var(--accent-cyan); border-radius: 8px; padding: 12px 14px; }
    .sounddesign-title { color: var(--accent-cyan); font-weight: bold; font-size: 14px; margin-bottom: 6px; }
    .sounddesign-content { font-size: 13px; color: var(--text); line-height: 1.5; }
    .synth-tag { background: #003650; color: var(--accent-cyan); padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; margin-right: 4px; }
    .band-tag { background: #4b1220; color: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; margin-right: 4px; }
    .modulation-card { background: #14141d; border: 1px solid var(--accent-green); border-radius: 12px; padding: 20px; margin-top: 25px; }
    .modulation-card h2 { margin-top: 0; color: var(--accent-green); font-size: 18px; }
    .mod-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 15px; }
    .mod-item { background: #1c1c28; padding: 12px; border-radius: 8px; border: 1px solid #2b2b3c; }
    .mod-item-title { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }
    .mod-item-key { font-size: 16px; font-weight: bold; color: #fff; margin: 4px 0; }
    .mod-item-desc { font-size: 12px; color: var(--accent-green); }
  </style>
</head>

function splitIntoSyllables(text) {
  if (!text) return [];
  const words = text.replace(/[^a-zA-Zа-яА-ЯёЁ\s]/g, "").split(/\s+/);
  let syllables = [];

  words.forEach(word => {
    if (!word) return;
    const matches = word.match(/[^aeiouyаеёиоуыэюя]*[aeiouyаеёиоуыэюя]+(?:[^aeiouyаеёиоуыэюя]*$|[^aeiouyаеёиоуыэюя](?=[^aeiouyаеёиоуыэюя][aeiouyаеёиоуыэюя]))?/gi);
    if (matches) {
      syllables.push(...matches);
    } else {
      syllables.push(word);
    }
  });
  return syllables;
}

function generateVocalNotes(sectionId) {
  const currentKey = document.getElementById("key-select").value;
  const keyScale = keys[currentKey] ? keys[currentKey].scale : [60, 62, 64, 65, 67, 69, 71];
  const lyricsInput = document.getElementById(`lyrics-${sectionId}`);
  const lyricsText = lyricsInput ? lyricsInput.value : "";
  const syllables = splitIntoSyllables(lyricsText);

  let vocalNotes = [];
  const ticksPerBeat = 128;

  syllables.forEach((syl, idx) => {
    const scaleIndex = (idx * 2 + (idx % 3)) % keyScale.length;
    const note = keyScale[scaleIndex];
    const duration = (idx % 4 === 3) ? ticksPerBeat * 2 : ticksPerBeat;
    
    vocalNotes.push({
      syllable: syl,
      note: note,
      duration: duration
    });
  });

  return { syllables, vocalNotes };
}

function updateVocalPreview(sectionId) {
  const { syllables, vocalNotes } = generateVocalNotes(sectionId);
  const countEl = document.getElementById(`syl-count-${sectionId}`);
  if (countEl) countEl.innerText = `${syllables.length} слогов`;

  const previewText = vocalNotes.map(n => `[${n.syllable}: MIDI ${n.note}]`).join(" ");
  const previewEl = document.getElementById(`vocal-preview-${sectionId}`);
  if (previewEl) previewEl.innerText = previewText || "Введите текст...";
}

// === УНИВЕРСАЛЬНЫЙ БАЙТОВЫЙ ДВИЖОК ДЛЯ DAW (STUDIO ONE, REAPER, LOGIC) ===

function writeVarInt(val) {
  let buffer = [];
  let b;
  while (true) {
    b = val & 0x7F; val >>= 7;
    if (val > 0) b |= 0x80;
    buffer.push(b);
    if (val === 0) break;
  }
  return buffer.reverse();
}

function buildMIDIFileFromEvents(events) {
  const bpm = parseInt(document.getElementById("bpm-input").value) || 140;
  const microsecondsPerBeat = Math.round(60000000 / bpm);

  let trackBytes = [];
  
  // 1. Установка темпа BPM (Meta Event)
  trackBytes.push(...writeVarInt(0), 0xFF, 0x51, 0x03, 
    (microsecondsPerBeat >> 16) & 0xFF, 
    (microsecondsPerBeat >> 8) & 0xFF, 
    microsecondsPerBeat & 0xFF
  );

  // 2. Установка размера 4/4 (Meta Event)
  trackBytes.push(...writeVarInt(0), 0xFF, 0x58, 0x04, 0x04, 0x02, 0x18, 0x08);

  // 3. Запись всех нотных событий
  events.forEach(e => {
    trackBytes.push(...writeVarInt(e.deltaTime));
    if (e.type === 0xFF) { 
      trackBytes.push(0xFF, e.metaType, e.data.length, ...e.data); 
    } else { 
      trackBytes.push(e.type, e.note, e.velocity); 
    }
  });

  // 4. Закрывающий маркер конца трека
  trackBytes.push(...writeVarInt(0), 0xFF, 0x2F, 0x00);

  // Заголовки стандартного MIDI файла (Format 0)
  let header = [0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x80];
  let trackHeader = [0x4D, 0x54, 0x72, 0x6B, (trackBytes.length >> 24) & 0xFF, (trackBytes.length >> 16) & 0xFF, (trackBytes.length >> 8) & 0xFF, trackBytes.length & 0xFF];

  return new Uint8Array([...header, ...trackHeader, ...trackBytes]);
}

function downloadMIDI(midiData, filename) {
  // Исправлено: Универсальный тип octet-stream гарантирует корректную передачу в Studio One
  let blob = new Blob([midiData], { type: "application/octet-stream" });
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function downloadVocalMIDI(sectionId) {
  const { vocalNotes } = generateVocalNotes(sectionId);
  if (!vocalNotes.length) return alert("Введите текст секции!");

  let trackEvents = [];
  vocalNotes.forEach(n => {
    trackEvents.push({ deltaTime: 0, type: 0x90, note: n.note, velocity: 100 });
    trackEvents.push({ deltaTime: n.duration, type: 0x80, note: n.note, velocity: 0 });
  });

  const midiData = buildMIDIFileFromEvents(trackEvents);
  downloadMIDI(midiData, `Vocal_${sectionId}.mid`);
}

function downloadSectionMIDI(sectionId) {
  const currentKey = document.getElementById("key-select").value;
  const useSevenths = document.getElementById("sevenths-toggle").checked;
  const progIndex = currentProgressionSelection[sectionId];
  const sectionObj = songStructure.find(s => s.id === sectionId);
  const progData = progressionsPool[sectionObj.type][progIndex];
  
  const res = getChordsAndTabs(currentKey, progData.pattern, useSevenths);
  let trackEvents = [];
  const ticksPerBeat = 128;

  res.rawChords.forEach(chord => {
    let notes = parseChordToMIDINotes(chord);
    notes.forEach(n => trackEvents.push({ deltaTime: 0, type: 0x90, note: n, velocity: 90 }));
    notes.forEach((n, idx) => trackEvents.push({ deltaTime: idx === 0 ? ticksPerBeat * 4 : 0, type: 0x80, note: n, velocity: 0 }));
  });

  const midiData = buildMIDIFileFromEvents(trackEvents);
  downloadMIDI(midiData, `${sectionId}_Chords.mid`);
}

function downloadFullSongMIDI() {
  const currentKey = document.getElementById("key-select").value;
  const useSevenths = document.getElementById("sevenths-toggle").checked;
  let trackEvents = [];
  const ticksPerBeat = 128;

  songStructure.forEach(section => {
    const progIndex = currentProgressionSelection[section.id];
    const progData = progressionsPool[section.type][progIndex];
    const res = getChordsAndTabs(currentKey, progData.pattern, useSevenths);
    
    res.rawChords.forEach(chord => {
      let notes = parseChordToMIDINotes(chord);
      notes.forEach(n => trackEvents.push({ deltaTime: 0, type: 0x90, note: n, velocity: 90 }));
      notes.forEach((n, idx) => trackEvents.push({ deltaTime: idx === 0 ? ticksPerBeat * 4 : 0, type: 0x80, note: n, velocity: 0 }));
    });
  });

  const midiData = buildMIDIFileFromEvents(trackEvents);
  downloadMIDI(midiData, `FullSong_${currentKey}.mid`);
}

function toggleFeedback(sectionId, type) {
  if (userFeedback[sectionId] === type) delete userFeedback[sectionId];
  else userFeedback[sectionId] = type;
  
  localStorage.setItem("altrock_generator_feedback", JSON.stringify(userFeedback));
  const card = document.getElementById(`section-card-${sectionId}`);
  if (card) {
    card.className = `song-section ${userFeedback[sectionId] || ''}`;
    const btns = card.querySelectorAll('.feedback-btn');
    if (btns.length >= 2) {
      btns[0].className = `feedback-btn ${userFeedback[sectionId] === 'like' ? 'active-like' : ''}`;
      btns[1].className = `feedback-btn ${userFeedback[sectionId] === 'dislike' ? 'active-dislike' : ''}`;
    }
  }
}

function evolveSection(sectionId, type) {
  const currentKey = document.getElementById("key-select").value;
  const progIndex = currentProgressionSelection[sectionId];
  const baseProg = progressionsPool[type][progIndex];

  let evolvedPattern = [...baseProg.pattern];
  if (evolvedPattern.length === 2) evolvedPattern = [evolvedPattern[0], "5", evolvedPattern[1], "55"];
  else if (evolvedPattern.length === 4) evolvedPattern = [evolvedPattern[0], evolvedPattern[1], evolvedPattern[2] + "sus4", evolvedPattern[3]];

  const evolvedProg = {
    name: `🔥 Evolved: ${baseProg.name}`,
    pattern: evolvedPattern,
    roman: `${baseProg.roman} (Advanced Voice-Leading)`,
    mood: `💥 Развитая версия (${currentKey}): ${baseProg.mood}`,
    s1Sound: `${baseProg.s1Sound} + Pitch Shifter.`
  };

  progressionsPool[type].push(evolvedProg);
  const newIdx = progressionsPool[type].length - 1;
  const selectEl = document.getElementById(`select-prog-${sectionId}`);
  
  if (selectEl) {
    const opt = document.createElement("option");
    opt.value = newIdx; opt.innerText = evolvedProg.name;
    selectEl.appendChild(opt);
    currentProgressionSelection[sectionId] = newIdx;
    selectEl.value = newIdx;
  }
  
  toggleFeedback(sectionId, 'like');
  updateAll();
}

function getChordsAndTabs(key, pattern, useSevenths) {
  const keyData = keys[key];
  if (!keyData) return { chordsText: pattern.join(" - "), rawChords: [], tabsList: [] };
  const chordMap = useSevenths ? keyData.sevenths : keyData.triads;
  const rawChords = pattern.map(step => chordMap[step] || step);
  const tabsList = rawChords.map(ch => {
    const tabInfo = chordTabs[ch] || { frets: "x-x-x-x-x-x", shape: "Custom shape" };
    return { name: ch, frets: tabInfo.frets, shape: tabInfo.shape };
  });
  return { chordsText: rawChords.join(" - "), rawChords: rawChords, tabsList: tabsList };
}

function parseChordToMIDINotes(chordName) {
  let root = chordName.match(/^[A-G][#b]?/)[0];
  let type = chordName.substring(root.length);
  let rootPitch = midiNoteMap[root] || 60;
  let intervals = chordIntervals[type] || [0, 4, 7];
  return [rootPitch - 24, ...intervals.map(i => rootPitch + i)];
}

function updateAll() {
  const currentKey = document.getElementById("key-select").value;
  const useSevenths = document.getElementById("sevenths-toggle").checked;

  songStructure.forEach(section => {
    const progIndex = currentProgressionSelection[section.id];
    const progData = progressionsPool[section.type][progIndex];
    const res = getChordsAndTabs(currentKey, progData.pattern, useSevenths);
    
    document.getElementById(`chords-${section.id}`).innerText = res.chordsText;
    document.getElementById(`mood-${section.id}`).innerText = progData.mood;
    document.getElementById(`num-${section.id}`).innerText = `${progData.name} (${progData.roman})`;
    document.getElementById(`s1sound-${section.id}`).innerHTML = progData.s1Sound;

    const tabsContainer = document.getElementById(`tabs-${section.id}`);
    tabsContainer.innerHTML = "";
    res.tabsList.forEach(t => {
      const tabItem = document.createElement("div");
      tabItem.className = "tab-item";
      tabItem.innerHTML = `<div class="tab-chord-name">${t.name}</div><div class="tab-frets">${t.frets}</div><div class="tab-shape">${t.shape}</div>`;
      tabsContainer.appendChild(tabItem);
    });

    const rhythmIndex = currentRhythmSelection[section.id];
    const rhythmData = rhythmPool[section.type][rhythmIndex];
    document.getElementById(`rhythm-pat-${section.id}`).innerText = rhythmData.pattern;
    document.getElementById(`rhythm-desc-${section.id}`).innerText = rhythmData.desc;

    updateVocalPreview(section.id);
  });

  renderModulations(currentKey);
}

function renderModulations(currentKey) {
  const keyInfo = keys[currentKey];
  const modContainer = document.getElementById("modulation-ideas");
  modContainer.innerHTML = "";
  if (!keyInfo) return;

  const rules = [
    { title: "Параллельный ключ", target: keyInfo.type === "major" ? currentKey + "m" : currentKey.replace("m", "") },
    { title: "Квартовый шаг (IV)", target: keyInfo.triads[4] },
    { title: "Квинтовый шаг (V)", target: keyInfo.triads[55] || keyInfo.triads[5] },
    { title: "Подъем на тон ↑", target: "C / D..." }
  ];

  rules.forEach(item => {
    const div = document.createElement("div");
    div.className = "mod-item";
    div.innerHTML = `<div class="mod-item-title">${item.title}</div><div class="mod-item-key">➜ ${item.target}</div><div class="mod-item-desc">💡 Через V7 целевой тональности</div>`;
    modContainer.appendChild(div);
  });
}

function onProgChange(sectionId, val) { currentProgressionSelection[sectionId] = parseInt(val); updateAll(); }
function onRhythmChange(sectionId, val) { currentRhythmSelection[sectionId] = parseInt(val); updateAll(); }

function randomizeSection(sectionId, type) {
  const progPool = progressionsPool[type];
  const rhythmList = rhythmPool[type];
  currentProgressionSelection[sectionId] = Math.floor(Math.random() * progPool.length);
  currentRhythmSelection[sectionId] = Math.floor(Math.random() * rhythmList.length);
  document.getElementById(`select-prog-${sectionId}`).value = currentProgressionSelection[sectionId];
  document.getElementById(`select-rhythm-${sectionId}`).value = currentRhythmSelection[sectionId];
  updateAll();
}

function generateFullSong() {
  songStructure.forEach(section => {
    if (userFeedback[section.id] !== 'like') {
      randomizeSection(section.id, section.type);
    }
  });
}

document.addEventListener("DOMContentLoaded", function() {
  init();
});
</script>
